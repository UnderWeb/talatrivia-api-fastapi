services:
  talatrivia-api-fastapi:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: talatrivia-api-fastapi
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/usr/src/app
    depends_on:
      talatrivia-postgres:
        condition: service_healthy
    networks:
      - talatrivia-network

  talatrivia-postgres:
    image: postgres:16-alpine
    container_name: talatrivia-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: talatrivia_user
      POSTGRES_PASSWORD: talatrivia_password
      POSTGRES_DB: talatrivia_db
    volumes:
      - talatrivia-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talatrivia_user -d talatrivia_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talatrivia-network

volumes:
  talatrivia-postgres-data:

networks:
  talatrivia-network:
    driver: bridge
